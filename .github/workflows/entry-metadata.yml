name: Entry metadata

on:
  pull_request:

permissions:
  contents: read

jobs:
  model-metadata:
    name: model-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Run catalog and data tests
        run: uv run python -m unittest discover -s tests
      # Checks the catalog files' format only. A submitted model with no
      # release date or price is reported as pending and does not fail the
      # PR; resolve-model-metadata.yml proposes its entry after merge.
      - name: Validate model catalog format
        run: uv run python scripts/validate_model_metadata.py

  vendor-icons:
    name: vendor-icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Check model and vendor icons
        env:
          CATALOG_BOT: ${{ github.head_ref == 'bot/model-metadata' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CATALOG_BOT" == "true" ]]; then
            ARGS=(--all)
          else
            mapfile -t ARGS < <(
              git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}"..."${{ github.event.pull_request.head.sha }}" -- submissions \
                | awk -F/ 'NF>=3 && $1=="submissions" { print $1"/"$2"/"$3 }' | sort -u
            )
            if [[ ${#ARGS[@]} -eq 0 ]]; then
              echo "No changed entry packages."
              exit 0
            fi
          fi
          uv run python scripts/check_vendor_icons.py --summary "$GITHUB_STEP_SUMMARY" "${ARGS[@]}"
