name: Auto-merge catalog proposals

# Merges catalog proposals from resolve-model-metadata.yml (label `catalog`)
# once they have been idle for two days. Any comment, review, commit, or label
# change resets the clock, so a curator who wants to hold a proposal only
# needs to comment on it. Drafts and proposals with requested changes are
# left alone. When an idle proposal cannot be merged because of conflicts or
# failing checks, this workflow comments on the PR and triggers
# catalog-proposal-blocked.yml, which is the only run Slack is subscribed to.
on:
  schedule:
    # Every six hours.
    - cron: "23 */6 * * *"
  workflow_dispatch:

# Merging uses the catalog bot's installation token, not GITHUB_TOKEN:
# a push to main made with GITHUB_TOKEN would not trigger the Pages deploy,
# a branch update would not trigger the required checks, and a
# repository_dispatch would not start the notification workflow.
permissions:
  contents: read

concurrency:
  group: auto-merge-catalog-bot
  cancel-in-progress: false

env:
  LABEL: catalog
  IDLE_SECONDS: "172800" # two days

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a catalog bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CATALOG_BOT_APP_ID }}
          private-key: ${{ secrets.CATALOG_BOT_PRIVATE_KEY }}

      - name: Merge idle proposals
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BOT_LOGIN: app/${{ steps.app-token.outputs.app-slug }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Comment on the PR and start the Slack-subscribed notification
          # workflow. The comment also resets the idle clock, so a stuck
          # proposal is reported again only after two more quiet days.
          blocked() {
            local pr=$1 reason=$2
            echo "#$pr: not merged, $reason." | tee -a "$GITHUB_STEP_SUMMARY"
            gh pr comment "$pr" --body "Auto-merge skipped: $reason. A curator needs to resolve this; the proposal will be retried after two more days without activity. ([run]($RUN_URL))"
            jq -n --arg pr "$pr" --arg reason "$reason" \
              --arg url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/$pr" \
              '{event_type: "catalog-proposal-blocked", client_payload: {pr: $pr, reason: $reason, url: $url}}' \
              | gh api "repos/$GH_REPO/dispatches" --input -
          }

          # Open, non-draft PRs from the bot that carry the label and have
          # had no activity for IDLE_SECONDS.
          candidates=$(gh pr list --label "$LABEL" --state open \
            --json number,author,isDraft,updatedAt \
            --jq "map(select(.author.login == \"$BOT_LOGIN\"
                             and (.isDraft | not)
                             and (.updatedAt | fromdateiso8601) < (now - $IDLE_SECONDS)))
                  | .[].number")

          if [ -z "$candidates" ]; then
            echo "No idle catalog proposals." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for pr in $candidates; do
            state=$(gh pr view "$pr" --json mergeStateStatus,reviewDecision,headRefOid)
            merge_state=$(jq -r .mergeStateStatus <<<"$state")
            review=$(jq -r '.reviewDecision // ""' <<<"$state")
            head=$(jq -r .headRefOid <<<"$state")

            if [ "$review" = "CHANGES_REQUESTED" ]; then
              echo "#$pr: changes requested; skipping." | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # main requires branches to be up to date. Bring the proposal up
            # to date and wait for the required checks on the new head.
            if [ "$merge_state" = "BEHIND" ]; then
              echo "#$pr: behind main; updating branch."
              if ! gh pr update-branch "$pr"; then
                blocked "$pr" "the branch could not be updated with main (merge conflicts)"
                continue
              fi
              sleep 30
              head=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
              if ! gh pr checks "$pr" --required --watch --fail-fast --interval 30; then
                blocked "$pr" "required checks failed after updating the branch with main"
                continue
              fi
              merge_state=$(gh pr view "$pr" --json mergeStateStatus --jq .mergeStateStatus)
            fi

            case "$merge_state" in
              CLEAN) ;;
              DIRTY)
                blocked "$pr" "the branch has merge conflicts with main"
                continue ;;
              BLOCKED)
                # Exit code 8 means checks are still pending; retry next run.
                rc=0; gh pr checks "$pr" --required >/dev/null || rc=$?
                if [ "$rc" -eq 8 ]; then
                  echo "#$pr: required checks pending; retrying next run."
                else
                  blocked "$pr" "required checks failed"
                fi
                continue ;;
              *)
                echo "#$pr: merge state is $merge_state; retrying next run." | tee -a "$GITHUB_STEP_SUMMARY"
                continue ;;
            esac

            # --match-head-commit refuses the merge if the bot pushed again
            # after the checks above.
            gh pr merge "$pr" --merge --delete-branch --match-head-commit "$head"
            echo "#$pr: merged after two days without activity." | tee -a "$GITHUB_STEP_SUMMARY"
          done
