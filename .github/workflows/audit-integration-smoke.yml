name: Audit integration smoke

on:
  push:
    branches: [ci/trajectory-audit]
    paths: [.github/workflows/audit-integration-smoke.yml]

permissions:
  contents: read

jobs:
  review:
    runs-on: nika-audit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: sands-lab/nika
          ref: f6e43d02ee7d6858a83c6753143f21e8843df1a9
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.8.22"
      - run: uv sync --no-dev --python /usr/bin/python3
      - name: Review a real HF trajectory through the CI library
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          uv run python - <<'PYTHON'
          import json, os
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          from nika.audit.ci import REVIEW_COMMAND
          from nika.audit.runner import audit_trajectories, write_report
          from nika.workflows.leaderboard.review import review_trajectories
          root = Path(os.environ['RUNNER_TEMP']) / ('nika-audit-smoke-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          dataset = 'nika-bench/nika-trajectories'
          revision = '04fcd6ea825295d0655085b67e6eeefefdff7685'
          path = 'trajectories/0.2.0/20261011_react_qwen3_8_27b_fp8/trials/campus_lan__host_incorrect_d__h5ac233e53e43__t01'
          for name in ['run.json','messages.jsonl','nika.jsonl','ground_truth.json','eval_metrics.json','submission.json']:
              hf_hub_download(dataset, f'{path}/{name}', repo_type='dataset', revision=revision, local_dir=root / 'input')
          report = audit_trajectories(root / 'input' / path)
          assert report['package']['n_trials'] == 1
          write_report(report, root / 'review' / 'deterministic.json')
          summary = review_trajectories(root / 'input' / path, root / 'review', command=REVIEW_COMMAND)
          print(json.dumps({'trials':summary['trials'], 'complete':summary['complete'], 'errors':summary['errors']}))
          assert summary['complete']
          PYTHON
      - name: Publish smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-integration-smoke
          path: ${{ runner.temp }}/nika-audit-smoke-${{ github.run_id }}-${{ github.run_attempt }}/review/
