name: Validate submission

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  model-metadata:
    name: model-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Run catalog and data tests
        run: uv run python -m unittest discover -s tests
      # Checks the catalog files' format only. A submitted model with no
      # release date or price is reported as pending and does not fail the
      # PR; resolve-model-metadata.yml proposes its entry after merge.
      - name: Validate model catalog format
        run: uv run python scripts/validate_model_metadata.py

  # Finds the submission packages a PR adds or changes. The NIKA install and
  # validation below run only when there is at least one; other PRs skip the
  # `validate` job. The gate is a job condition rather than an `on.paths`
  # filter because `validate` is a required check: a job skipped by its `if`
  # reports success, while a workflow skipped by a path filter leaves the
  # check pending and blocks the merge.
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
      audit_matrix: ${{ steps.discover.outputs.audit_matrix }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Discover new submission packages
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mapfile -t CHANGED < <(
            git diff --name-only --diff-filter=ACMR "$BASE"..."$HEAD" -- submissions \
              | awk -F/ 'NF>=3 && $1=="submissions" { print $1"/"$2"/"$3 }' \
              | sort -u
          )
          PACKAGES=()
          for dir in "${CHANGED[@]:-}"; do
            if [[ -f "$dir/metadata.yaml" && -f "$dir/results/identity.yaml" ]]; then
              PACKAGES+=("$dir")
            fi
          done
          if [[ ${#PACKAGES[@]} -eq 0 ]]; then
            echo "No new submission packages found under submissions/; skipping validation."
            echo "packages=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "packages<<EOF"
            printf '%s\n' "${PACKAGES[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          python3 - "${PACKAGES[@]}" <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json, sys
          print("audit_matrix=" + json.dumps({"include": [{"package": p, "artifact": "submission-audit-" + p.replace("/", "-")} for p in sys.argv[1:]]}))
          PYTHON
          echo "Found packages:"
          printf '  - %s\n' "${PACKAGES[@]}"

  trajectory-audit:
    needs: changes
    if: needs.changes.outputs.packages != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.audit_matrix) }}
    uses: sands-lab/nika/.github/workflows/submission-audit.yml@f5fd56e9a699b10e4d9e27d8acb1e8f40738dcfe
    with:
      package: ${{ matrix.package }}
      artifact_name: ${{ matrix.artifact }}
      scores_repository: ${{ github.repository }}
      scores_ref: ${{ github.event.pull_request.head.sha }}
      nika_ref: ${{ vars.NIKA_REF || 'f5fd56e9a699b10e4d9e27d8acb1e8f40738dcfe' }}

  validate:
    needs: [changes, trajectory-audit]
    # Also run when discovery did not succeed, so a broken `changes` job fails
    # this required check instead of skipping it.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.packages != '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require package discovery
        if: needs.changes.result != 'success'
        run: |
          echo "::error::Submission package discovery did not succeed (${{ needs.changes.result }}); see the changes job."
          exit 1

      - name: Require trajectory audit
        if: needs.trajectory-audit.result != 'success'
        run: |
          echo "::error::Trajectory audit did not pass (${{ needs.trajectory-audit.result }}); inspect its evidence artifacts."
          exit 1


  audit-report:
    needs: [changes, trajectory-audit]
    if: ${{ !cancelled() && needs.changes.outputs.packages != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: submission-audit-*
          path: audit-reports
      - name: Report the audit on the pull request
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          AUDIT_RESULT: ${{ needs.trajectory-audit.result }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const marker = '<!-- nika-trajectory-audit -->';
            const rows = [];
            if (fs.existsSync('audit-reports')) {
              for (const name of fs.readdirSync('audit-reports')) {
                const file = path.join('audit-reports', name, 'audit.json');
                if (!fs.existsSync(file)) continue;
                const report = JSON.parse(fs.readFileSync(file, 'utf8'));
                const slug = String(report.package?.slug || '').replace(/[^a-zA-Z0-9_.-]/g, '');
                const verdict = ['pass', 'warn', 'block'].includes(report.verdict) ? report.verdict : 'unknown';
                const trials = Number.isSafeInteger(report.package?.n_trials) ? report.package.n_trials : '?';
                rows.push('| ' + slug + ' | ' + verdict + ' | ' + trials + ' |');
              }
            }
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const body = marker + '\n## Trajectory audit\n\n' +
              'Audit job: **' + process.env.AUDIT_RESULT + '**. [Reports and cited evidence](' + runUrl + ').\n\n' +
              (rows.length ? '| Entry | Verdict | Trials |\n| --- | --- | --- |\n' + rows.join('\n') + '\n\n' : 'No completed audit report. Inspect the job failure before accepting this entry.\n\n') +
              'Warnings require review. The audit preserves recorded trajectories and scores.';
            await core.summary.addRaw(body).write();
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: context.issue.number});
            const previous = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
            if (previous) await github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
            else await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});


  # Not a required check, by design: an entry shown without a model or vendor
  # icon is a display gap, so the maintainer decides whether to merge. Runs
  # only where icons can change: on PRs that add or change a submission
  # package (checking those packages), and on the catalog bot's proposals
  # from resolve-model-metadata.yml (checking every package). Other
  # maintenance PRs skip it.
  vendor-icons:
    name: vendor-icons
    needs: changes
    if: ${{ needs.changes.outputs.packages != '' || github.head_ref == 'bot/model-metadata' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Check model and vendor icons
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
          CATALOG_BOT: ${{ github.head_ref == 'bot/model-metadata' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CATALOG_BOT" == "true" ]]; then
            ARGS=(--all)
          else
            mapfile -t ARGS <<< "$PACKAGES"
          fi
          uv run python scripts/check_vendor_icons.py --summary "$GITHUB_STEP_SUMMARY" "${ARGS[@]}"
