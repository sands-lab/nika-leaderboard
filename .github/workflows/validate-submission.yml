name: Validate submission

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  model-metadata:
    name: model-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Run catalog and data tests
        run: uv run python -m unittest discover -s tests
      # Checks the catalog files' format only. A submitted model with no
      # release date or price is reported as pending and does not fail the
      # PR; resolve-model-metadata.yml proposes its entry after merge.
      - name: Validate model catalog format
        run: uv run python scripts/validate_model_metadata.py

  # Not a required check, by design: an entry shown without a model or vendor
  # icon is a display gap, so the maintainer decides whether to merge. Checks the
  # packages this PR adds or changes, or all of them when it edits the vendor
  # catalog.
  vendor-icons:
    name: vendor-icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Check model and vendor icons
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE"..."$HEAD")
          if grep -qE '^catalog/(vendors|hf_orgs|lobehub)\.json$' <<< "$CHANGED"; then
            ARGS=(--all)
          else
            mapfile -t ARGS < <(
              awk -F/ 'NF>=4 && $1=="submissions" { print $1"/"$2"/"$3 }' <<< "$CHANGED" | sort -u
            )
          fi
          uv run python scripts/check_vendor_icons.py --summary "$GITHUB_STEP_SUMMARY" "${ARGS[@]}"

  # Finds the submission packages a PR adds or changes. The NIKA install and
  # validation below run only when there is at least one; other PRs skip the
  # `validate` job. The gate is a job condition rather than an `on.paths`
  # filter because `validate` is a required check: a job skipped by its `if`
  # reports success, while a workflow skipped by a path filter leaves the
  # check pending and blocks the merge.
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Discover new submission packages
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mapfile -t CHANGED < <(
            git diff --name-only --diff-filter=ACMR "$BASE"..."$HEAD" -- submissions \
              | awk -F/ 'NF>=3 && $1=="submissions" { print $1"/"$2"/"$3 }' \
              | sort -u
          )
          PACKAGES=()
          for dir in "${CHANGED[@]:-}"; do
            if [[ -f "$dir/metadata.yaml" && -f "$dir/results/identity.yaml" ]]; then
              PACKAGES+=("$dir")
            fi
          done
          if [[ ${#PACKAGES[@]} -eq 0 ]]; then
            echo "No new submission packages found under submissions/; skipping validation."
            echo "packages=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "packages<<EOF"
            printf '%s\n' "${PACKAGES[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Found packages:"
          printf '  - %s\n' "${PACKAGES[@]}"

  validate:
    needs: changes
    # Also run when discovery did not succeed, so a broken `changes` job fails
    # this required check instead of skipping it.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.packages != '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require package discovery
        if: needs.changes.result != 'success'
        run: |
          echo "::error::Submission package discovery did not succeed (${{ needs.changes.result }}); see the changes job."
          exit 1

      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install NIKA
        env:
          # Override with repo variable NIKA_REF to pin a branch/tag/commit.
          NIKA_REF: ${{ vars.NIKA_REF }}
        run: |
          set -euo pipefail
          REF="${NIKA_REF:-main}"
          # Editable clone keeps benchmark/releases on disk (needed by validate).
          git clone --depth 1 --branch "$REF" https://github.com/sands-lab/nika.git "$HOME/nika"
          # uv sync, not pip: the CLI imports the default `labs` dependency group
          # (docker, kathara), which pip does not install.
          uv sync --project "$HOME/nika" --no-dev
          echo "$HOME/nika/.venv/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/nika/.venv/bin:$PATH"
          if ! nika --help 2>&1 | grep -q leaderboard; then
            echo "::error::Installed NIKA from ref '${REF}' has no 'nika leaderboard' command."
            nika --help || true
            exit 1
          fi
          echo "Using NIKA ref: ${REF}"
          nika leaderboard --help

      - name: Validate packages
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        shell: bash
        run: |
          set -euo pipefail
          FAILED=0
          SUMMARY=""
          while IFS= read -r pkg; do
            [[ -z "$pkg" ]] && continue
            echo "::group::validate $pkg"
            if nika leaderboard validate "$GITHUB_WORKSPACE/$pkg"; then
              SUMMARY+="- ✅ \`$pkg\`\n"
            else
              SUMMARY+="- ❌ \`$pkg\`\n"
              FAILED=1
            fi
            echo "::endgroup::"
          done <<< "$PACKAGES"
          {
            echo "## Leaderboard validation"
            echo ""
            echo -e "$SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$FAILED"
