name: Deploy leaderboard site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Build leaderboard data
        run: uv run python scripts/build_leaderboard_data.py --skip-catalog-refresh

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build web
        working-directory: web
        env:
          VITE_BASE_PATH: /nika/leaderboard/
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-dist
          path: web/dist
          retention-days: 1

      - name: Upload Pages artifact (legacy redirect)
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/redirect

  publish-nika:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: leaderboard-dist
          path: dist

      - name: Publish to sands-lab/nika gh-pages/leaderboard
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          repository-name: sands-lab/nika
          branch: gh-pages
          target-folder: leaderboard
          token: ${{ secrets.NIKA_PAGES_TOKEN }}
          clean: true
          force: false
          commit-message: Deploy NIKA leaderboard site

  redirect-legacy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy legacy redirect to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
