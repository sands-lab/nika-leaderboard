name: Resolve model metadata

# Proposes release dates and reference prices for newly merged models, and
# appends a dated quote when a tracked price changes. It also matches models
# and vendors to LobeHub icons, falling back to Hugging Face organization
# avatars, and the weekly run picks up changed ones (catalog/vendors.json
# overrides them by hand). Changes arrive as a pull
# request from a branch in this repository for a curator to review; nothing
# is committed to main directly and submission PRs are never touched.
on:
  push:
    branches: [main]
    paths: ["submissions/**", "catalog/vendors.json"]
  schedule:
    # Mondays 06:00 UTC: price-change check for every catalogued model.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# The PR is opened with a GitHub App installation token, not
# GITHUB_TOKEN: events created with GITHUB_TOKEN do not trigger other
# workflows, so the required validate and model-metadata checks would never
# run on the bot PR. GITHUB_TOKEN itself only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: resolve-model-metadata
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Resolve from public catalogs
        id: resolve
        env:
          # A push only needs the new models; the weekly run also re-checks prices.
          REFRESH_FLAG: ${{ github.event_name == 'push' && '--no-refresh' || '' }}
        run: |
          set -euo pipefail
          uv run python scripts/resolve_model_metadata.py $REFRESH_FLAG --report "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          printf '\n🤖 Opened by the [resolve-model-metadata](%s) workflow.\n' \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            >> "$RUNNER_TEMP/report.md"

      - name: Mint a catalog bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CATALOG_BOT_APP_ID }}
          private-key: ${{ secrets.CATALOG_BOT_PRIVATE_KEY }}

      - name: Open or update the proposal PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bot/model-metadata
          delete-branch: true
          add-paths: |
            catalog/models.json
            catalog/pricing.json
            catalog/hf_orgs.json
            catalog/lobehub.json
            web/public/providers/hf/**
            web/public/providers/lobehub/**
          commit-message: "chore(catalog): resolve model release dates and reference prices"
          title: "chore(catalog): resolve model release dates and reference prices"
          body-path: ${{ runner.temp }}/report.md
          # Marks the PR for auto-merge-catalog-bot.yml, which merges it once
          # it has been idle for two days.
          labels: catalog
